services:
  launchpad:
    image: nginx:1.27-alpine
    container_name: launchpad
    restart: unless-stopped
    ports:
      - "${LAUNCHPAD_PORT:-8080}:80"
    environment:
      # Where nginx can reach Immich on your network (used for the status dot).
      IMMICH_URL: ${IMMICH_URL:-http://host.docker.internal:2283}    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mounted rather than baked in, so editing services.json goes live on refresh.
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
